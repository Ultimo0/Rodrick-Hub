<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hub-shell.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub <span class="dim">— Commandes</span></h1>
        <div class="subtitle">Catalogue complet des commandes de RodrickBOT.</div>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks">
        <a href="index.html">Accueil</a>
        <a href="dashboard.html" data-admin-only-link hidden>Instances</a>
        <a href="releases.html">Versions</a>
        <a href="commands.html">Commandes</a>
        <a href="community.html">Communauté</a>
        <a href="stats.html">Statistiques</a>
      </div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div class="search-bar">
      <div class="command-search-row">
        <label class="command-search">
          <span class="sr-only">Rechercher par commande, alias, usage ou description</span>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Rechercher une commande ou un usage…" autocomplete="off" />
        </label>
        <button id="clearSearch" class="clear-search" type="button" hidden>Effacer</button>
      </div>
      <div class="command-list-meta">
        <span id="commandCount" class="result-count" aria-live="polite"></span>
        <span class="muted-small">Ajoutez vos commandes utiles aux favoris avec ☆</span>
      </div>
      <div id="categoryPills" class="category-pills"></div>
    </div>

    <div id="error" role="alert"></div>
    <div id="commandFeedback" class="action-feedback" role="status" aria-live="polite" hidden></div>
    <div id="commandsList" class="commands-list"></div>
    <div id="empty" class="empty-filter" role="status" hidden>Aucune commande ne correspond à ta recherche.</div>
  </div>

  <script type="module" src="js/commands.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/notif-bell.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
