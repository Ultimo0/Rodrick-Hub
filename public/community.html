<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Communauté</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hub-shell.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub <span class="dim">— Communauté</span></h1>
        <div class="subtitle">Annonces, nouveautés, guides et publications autour de RodrickBOT.</div>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks">
        <a href="index.html">Accueil</a>
        <a href="dashboard.html" data-admin-only-link hidden>Instances</a>
        <a href="releases.html">Versions</a>
        <a href="commands.html">Commandes</a>
        <a href="community.html">Communauté</a>
        <a href="stats.html">Statistiques</a>
      </div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="notifBanner" class="notif-banner" style="display:none"></div>

    <div class="category-pills" id="categoryPills"></div>

    <div id="error" class="form-error"></div>
    <div id="postsList" class="posts-list"></div>
    <div id="empty" style="display:none">Aucune publication pour le moment.</div>

    <!-- "Lecteur" : s'affiche par-dessus la liste quand on clique sur un post -->
    <div id="reader" class="reader" style="display:none">
      <button id="readerClose" class="reader-close">← Retour à la liste</button>
      <div class="reader-category" id="readerCategory"></div>
      <h2 id="readerTitle"></h2>
      <div class="reader-meta" id="readerMeta"></div>
      <div class="reader-content" id="readerContent"></div>

      <div class="reactions-bar" id="reactionsBar"></div>

      <div class="comments-section">
        <h3 class="comments-title">Commentaires <span id="commentsCount"></span></h3>
        <div id="commentsError" class="form-error"></div>
        <form id="commentForm" class="comment-form" style="display:none">
          <textarea id="commentInput" class="comment-input" placeholder="Écrire un commentaire…" maxlength="500" rows="2"></textarea>
          <button type="submit" class="comment-submit">Publier</button>
        </form>
        <div id="commentLoginHint" class="comment-login-hint" style="display:none">
          <a href="login.html">Connectez-vous</a> pour commenter et réagir.
        </div>
        <button id="loadOlderComments" class="comments-load-older" type="button" style="display:none">Voir les commentaires précédents</button>
        <div id="commentsList" class="comments-list"></div>
      </div>
    </div>
  </div>

  <script src="js/community.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/notif-bell.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
