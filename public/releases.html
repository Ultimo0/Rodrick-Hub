<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Rodrick Hub — Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hub-shell.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><line x1="12" y1="7" x2="12" y2="4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><line x1="9" y1="16.5" x2="15" y2="16.5"/></svg></span>Rodrick Hub <span class="dim">— Versions</span></h1>
        <div class="subtitle">Historique des releases de RodrickBOT, changelog et téléchargement.</div>
      </div>
    </header>

    <nav class="hub-nav" id="hubNav">
      <div class="hub-nav-links" id="hubNavLinks">
        <a href="index.html">Accueil</a>
        <a href="dashboard.html" data-admin-only-link hidden>Instances</a>
        <a href="releases.html" class="active" aria-current="page">Versions</a>
        <a href="commands.html">Commandes</a>
        <a href="community.html">Communauté</a>
        <a href="stats.html">Statistiques</a>
      </div>
      <span id="authStatus" class="auth-status"></span>
    </nav>

    <div id="latestBanner"></div>

    <!-- Masqué par défaut — révélé par releases.js uniquement si la
         personne connectée est admin (voir /api/auth/me). Un visiteur
         normal ne voit ni ce panneau de publication, ni les cases à
         cocher / boutons modifier / supprimer sur les cartes plus bas. -->
    <details id="publishPanel" class="publish-panel" style="display:none">
      <summary>➕ Publier une nouvelle version</summary>
      <div id="keyBar">
        <input id="apiKeyInput" type="password" placeholder="Clé API du dashboard" />
      </div>
      <form id="publishForm">
        <input id="fVersion" type="text" placeholder="Version (ex: 1.64.0)" required />
        <input id="fDate" type="date" required />
        <textarea id="fChangelog" placeholder="Changelog (une ligne par changement)" rows="4"></textarea>
        <input id="fDownloadUrl" type="text" placeholder="Lien de téléchargement (ex: downloads/rodrickbot-1.64.0.zip)" />
        <button type="submit">Publier</button>
      </form>
      <div id="publishError"></div>
    </details>

    <div id="bulkToolbar" class="bulk-toolbar" style="display:none">
      <span id="bulkCount"></span>
      <button id="bulkDeleteBtn" class="btn-delete-outline">Supprimer la sélection</button>
    </div>

    <div id="error"></div>
    <div id="releasesList" class="release-list"></div>
    <div id="empty" style="display:none">Aucune version publiée pour le moment.</div>
  </div>

  <script src="js/releases.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/notif-bell.js"></script>
  <script src="js/auth-nav.js"></script>
</body>
</html>
